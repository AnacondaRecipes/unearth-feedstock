{% set name = "unearth" %}
{% set version = "0.18.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/unearth-{{ version }}.tar.gz
  sha256: 1e53d7f52f46dd5f875e77ff1c55b12477e215a092e4b66c9764a77df4a9b520

build:
  skip: true  # [py<38]
  script:
    - python -m pip install --no-deps --no-build-isolation --ignore-installed .
  entry_points:
    - unearth = unearth.__main__:cli
  number: 0

requirements:
  host:
    - pip
    - python
    - pdm-backend
  run:
    - httpx >=0.27.0,<1
    - packaging >=20
    - python

test:
  imports:
    - unearth
  source_files:
    - tests
  commands:
    - pip check
    # Skipping test_session_with_selfsigned_ca because pytest-httpserver is not on defaults
    - pytest tests
  requires:
    - pip
    - pytest >=6.1
    - pytest-httpserver >=1.0.4
    - flask >=2.1.2
    - requests-wsgi-adapter >=0.4.1
    - trustme >=0.9.0  # [py<313]
    - keyring
    - pytest-mock >=3.12.0

about:
  home: https://pypi.org/project/unearth/
  summary: A utility to fetch and download python packages
  description: A utility to fetch and download python packages
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/frostming/unearth
  doc_url: https://unearth.readthedocs.io

extra:
  recipe-maintainers:
    - theAeon
